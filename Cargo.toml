[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OffeneDatenmodellierung/databricks-rs"
authors = ["Mark Olliver"]
keywords = ["databricks", "sdk", "api", "lakehouse"]
categories = ["api-bindings", "asynchronous"]

# Versions: newest non-yanked release published more than 48h before
# 2026-09-25 (house rule). See docs/dependency-policy.md.
[workspace.dependencies]
databricks-core = { path = "crates/databricks-core", version = "0.1.0" }
bytes = "1.12.1"
fastrand = "2.5.0"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
httpdate = "1.0.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "http2", "charset", "system-proxy"] }
rust-ini = "0.21.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time", "sync", "rt"] }
tracing = "0.1.44"
url = "2.5.8"
# dev
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
