name: Upstream spec

# Weekly: if a newer databricks-sdk-go release (older than 48 hours) pins a
# newer OpenAPI spec, regenerate the IR, OpenAPI documents and Rust code and
# open a pull request.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: check
        run: python3 scripts/check_upstream.py --github
      - if: steps.check.outputs.update == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - if: steps.check.outputs.update == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: steps.check.outputs.update == 'true'
        name: Regenerate
        run: |
          git clone --depth 1 --branch "${{ steps.check.outputs.go_sdk_tag }}" \
            https://github.com/databricks/databricks-sdk-go /tmp/go-sdk
          (cd codegen/extract-go && go run . -sdk /tmp/go-sdk -out ../../spec/ir.json)
          cargo xtask codegen
          cargo check -p community-databricks-sdk --features full
          # Refresh the parity report; new Go surface shows up as errors
          # here and in the PR's CI until parity.toml or the code covers it.
          python3 scripts/check_parity.py /tmp/go-sdk || echo "::warning::new databricks-sdk-go surface; see spec/PARITY.md and CI"
          # The docs spot-check header names the spec version; CI diffs it.
          python3 spec/docs-check/compare.py
      - if: steps.check.outputs.update == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # CI on PRs opened with the default GITHUB_TOKEN waits for a
          # maintainer to approve it ("action_required"). Set
          # UPSTREAM_PR_TOKEN (a GitHub App or fine-grained token with
          # contents and pull-requests write) so the checks start at once.
          token: ${{ secrets.UPSTREAM_PR_TOKEN || github.token }}
          branch: upstream/${{ steps.check.outputs.go_sdk_tag }}
          title: "spec: databricks-sdk-go ${{ steps.check.outputs.go_sdk_tag }} (OpenAPI ${{ steps.check.outputs.openapi_sha }})"
          commit-message: "spec: regenerate from databricks-sdk-go ${{ steps.check.outputs.go_sdk_tag }}"
          body: |
            Regenerated `spec/ir.json`, `spec/openapi/*.json` and the generated
            Rust service modules from databricks-sdk-go
            ${{ steps.check.outputs.go_sdk_tag }} (OpenAPI `${{ steps.check.outputs.openapi_sha }}`).

            See `spec/GENERATED.md` for the surface summary and
            `spec/PARITY.md` for parity with the Go SDK's hand-written surface.
      # Each tag gets its own branch, so close older upstream/* PRs: the new
      # one carries everything they did, and merging a stale one could ship
      # a package upstream has since removed.
      - if: steps.cpr.outputs.pull-request-number != ''
        name: Close superseded upstream PRs
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
          NEW_BRANCH: upstream/${{ steps.check.outputs.go_sdk_tag }}
        run: |
          gh pr list --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("upstream/")) | select(.headRefName != env.NEW_BRANCH) | .number' |
          while read -r n; do
            gh pr close "$n" --delete-branch --comment "Superseded by #$NEW_PR."
          done
