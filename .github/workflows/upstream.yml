name: Upstream spec

# Weekly: if a newer databricks-sdk-go release (older than 48 hours) pins a
# newer OpenAPI spec, regenerate the IR, OpenAPI documents and Rust code and
# open a pull request.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: check
        run: python3 scripts/check_upstream.py --github
      - if: steps.check.outputs.update == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - if: steps.check.outputs.update == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: steps.check.outputs.update == 'true'
        name: Regenerate
        run: |
          git clone --depth 1 --branch "${{ steps.check.outputs.go_sdk_tag }}" \
            https://github.com/databricks/databricks-sdk-go /tmp/go-sdk
          (cd codegen/extract-go && go run . -sdk /tmp/go-sdk -out ../../spec/ir.json)
          cargo xtask codegen
          cargo check -p community-databricks-sdk --features full
      - if: steps.check.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream/${{ steps.check.outputs.go_sdk_tag }}
          title: "spec: databricks-sdk-go ${{ steps.check.outputs.go_sdk_tag }} (OpenAPI ${{ steps.check.outputs.openapi_sha }})"
          commit-message: "spec: regenerate from databricks-sdk-go ${{ steps.check.outputs.go_sdk_tag }}"
          body: |
            Regenerated `spec/ir.json`, `spec/openapi/*.json` and the generated
            Rust service modules from databricks-sdk-go
            ${{ steps.check.outputs.go_sdk_tag }} (OpenAPI `${{ steps.check.outputs.openapi_sha }}`).

            See `spec/GENERATED.md` for the surface summary.
