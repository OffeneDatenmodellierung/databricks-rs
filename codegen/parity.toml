# Go SDK surface this SDK covers by hand, plans to cover, or deliberately
# leaves out. Checked by scripts/check_parity.py (CI), which fails on any
# Go surface that isn't generated, covered by a rule, or listed here, and
# on entries that no longer match anything. See spec/PARITY.md.
#
# Keys are Go symbols (fnmatch patterns allowed):
#   [accessors]  "<client>.<Field>"             workspace_client.go / account_client.go
#   [methods]    "<package>.<Service>.<Method>" api.go interfaces
#   [helpers]    "<package>.<Type>.<Func>", "<package>.<Func>", "<Client>.<Func>"
# status = "implemented" (rust = "path#fn"), "gap" (issue = N) or "na" (reason).

[accessors]
"*.Users" = { status = "gap", issue = 14 }
"*.Groups" = { status = "gap", issue = 14 }
"*.ServicePrincipals" = { status = "gap", issue = 14 }
"workspace.ServingEndpointsDataPlane" = { status = "gap", issue = 16 }

[methods]
"*.*.*To*Map" = { status = "gap", issue = 17 }
# List-and-search lookups (positional GetByX shortcuts are covered by rule).
"*.*.GetBy*" = { status = "gap", issue = 17 }
"serving.ServingEndpointsDataPlane.Query" = { status = "gap", issue = 16 }
"bundle.Bundle.*" = { status = "na", reason = "Go's `service/bundle` isn't wired into its WorkspaceClient or AccountClient, so it isn't reachable API surface there; `bundledeployments` is generated." }

[helpers]
# Implemented here.
"jobs.JobsAPI.Get" = { status = "implemented", rust = "crates/community-databricks-sdk-jobs/src/ext.rs#get" }
"jobs.JobsAPI.GetRun" = { status = "implemented", rust = "crates/community-databricks-sdk-jobs/src/ext.rs#get_run" }
"jobs.JobsAPI.List" = { status = "implemented", rust = "crates/community-databricks-sdk-jobs/src/ext.rs#list" }
"jobs.JobsAPI.ListRuns" = { status = "implemented", rust = "crates/community-databricks-sdk-jobs/src/ext.rs#list_runs" }
"provisioning.Workspace.AzureResourceId" = { status = "implemented", rust = "crates/community-databricks-sdk-provisioning/src/ext.rs#azure_resource_id" }
"AccountClient.GetWorkspaceClient" = { status = "implemented", rust = "crates/community-databricks-sdk/src/lib.rs#get_workspace_client" }
# Go wraps these only to escape `tag_key`; every generated single-segment
# path parameter is escaped.
"catalog.EntityTagAssignmentsAPI.*" = { status = "implemented", rust = "crates/community-databricks-core/src/http.rs#path_param" }
"tags.*API.*Tag*" = { status = "implemented", rust = "crates/community-databricks-core/src/http.rs#path_param" }

